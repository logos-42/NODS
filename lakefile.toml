name = "Nods"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Nods"]

[leanOptions]
pp.unicode.fun = true

# --- 本地物化依赖 (不联网) ---
# lean-toolchain = v4.35.0；mathlib 为唯一顶层依赖，其传递依赖
# (batteries/Qq/aesop/proofwidgets/importGraph/LeanSearchClient/plausible/Cli)
# 由 Lake 从 mathlib 的 lakefile 自动解析——.lake/packages/ 下的 symlink 指向
# NavierStokesAndEuler 工程已编译好的 v4.35.0 物化（不重新下载/编译）。
# 旧自含物化 (.lake/packages/v4.21.0) 已废弃。
[[require]]
name = "mathlib"
path = ".lake/packages/mathlib"

[[lean_lib]]
name = "Nods"