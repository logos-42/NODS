# Pinned build for artifact / CI.
#
# The working copy builds offline against a materialised Mathlib in
# .lake/packages/mathlib (a path dependency, see lakefile.toml).  That is fine
# on this machine and useless to anyone else: a path dependency has no revision,
# so a reader cannot reproduce the build.
#
# This file pins the same Mathlib commit by git revision, which is what CI and
# the artifact use:
#
#     cp lakefile.pinned.toml lakefile.toml
#     rm -f lake-manifest.json
#     lake update && lake exe cache get && lake build Nods
#
# The revision below is the HEAD of the materialised Mathlib on the machine where
# the paper's numbers were produced.  It is a record of what was built, not a
# recommendation to upgrade.

name = "Nods"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Nods"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Nods"
